# CONTEXTE ÉTUDIANT : S1-S2 | lancer depuis la racine du dépôt étudiant
# À PRÉPARER / ADAPTER : Générer .env ; conserver le port DB accessible seulement sur la loopback.
# CONTRÔLE ATTENDU : API locale vers campus ; terminal de tests séparé vers campus_test ; Kafka sur 127.0.0.1:9092.
#
# S1-S2 uniquement : DB, reverse proxy et Kafka conteneurisés, API exécutée sur le poste.
name: campusdata-dev
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}
    # L’API tourne sur le poste : accès DB par 127.0.0.1:5432, pas par db.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      # Volume de développement distinct de pgdata dans la pile S3.
      # Les données ne sont pas transférées automatiquement entre ces volumes.
      - devpgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
  web:
    image: nginxinc/nginx-unprivileged:stable-alpine
    # Poste 127.0.0.1:8080 -> Nginx :8080 ; Nginx relaie /api vers Uvicorn :8000 du poste.
    ports:
      - "127.0.0.1:8090:8080"
    # Relier le nom host.docker.internal à la passerelle du poste sous Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Bind mounts en lecture seule : les modifications locales sont visibles
      # sans reconstruire l’image ; les droits Unix du poste restent à respecter.
      - ./web:/usr/share/nginx/html:ro
      - ./web/dev.conf:/etc/nginx/conf.d/default.conf:ro
  # Broker Kafka (S2, tâche 5b) : simulateur et consommateur tournent sur le poste.
  # Démarré seulement à la demande : docker compose -f compose.dev.yaml up -d kafka
  kafka:
    image: apache/kafka:4.1.0
    # Poste 127.0.0.1:9092 -> Kafka :9092, comme 5432 pour PostgreSQL.
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      # Mode KRaft : un seul processus est à la fois broker et contrôleur (pas de ZooKeeper).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # Adresse que Kafka donne à ses clients : ici le poste, qui la joint par le port publié.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # Un seul broker : chaque donnée interne n'a qu'une copie.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topic créé au premier usage, avec 3 partitions (une par salle au plus).
      KAFKA_NUM_PARTITIONS: 3
      # Mémoire Java bornée : suffisant pour le TP sur un portable.
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
    # Pas de volume : en développement, Kafka n'est qu'un tampon jetable.
    # Les mesures reçues sont dans PostgreSQL, pas dans Kafka.
volumes:
  devpgdata:
